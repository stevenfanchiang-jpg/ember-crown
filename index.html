<style>
/* Layout: full-screen tactics RPG. HUD on top, painted battlefield as the hero, dispatch panel beside (below on phones). Full-screen overlays for towns, world map, dialogue and menus. Deliberate single dark look. */
:root{
  color-scheme:dark;
  --bg:#0e1512; --panel:#16201c; --panel-2:#1e2a25; --line:#33453d;
  --ink:#efe8d4; --muted:#a7b1a1; --gold:#dcb25a; --gold-2:#f3d488;
  --azure:#3a6fd8; --azure-2:#8db5f2; --crimson:#cf3f2e; --crimson-2:#f39a85;
  --good:#86c96f; --hurt:#e3b046; --bad:#e2604f; --ally:#4fae6a;
  --font-display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --font-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body,button,canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px;max-width:1320px;margin:0 auto}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:8px 12px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:10px}
.mt{flex:1 1 220px;min-width:0}
.mname{font-family:var(--font-display);font-size:21px;line-height:1.05;text-wrap:balance}
.mobj{font-size:13px;color:var(--muted)}
.turnbox{display:flex;align-items:center;gap:8px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.chip{width:12px;height:26px;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);background:var(--azure)}
.chip.R{background:var(--crimson)}
.gold{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--gold-2);font-variant-numeric:tabular-nums}
.gold i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#e4b64e 55%,#9c7428);border:1px solid #6d5a2c}
.tools{display:flex;gap:6px}
.icon{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:800 14px var(--font-body);cursor:pointer;display:grid;place-items:center}
.icon:hover{background:#2a3a33}
.icon svg{width:18px;height:18px}
.b{font:700 14px/1.1 var(--font-body);color:var(--ink);background:#2a3a33;border:1px solid #43564c;border-radius:8px;padding:10px 12px;cursor:pointer;min-height:40px}
.b:hover:not(:disabled){background:#33463d}
.b:disabled{opacity:.38;cursor:default}
.b.sm{min-height:32px;padding:6px 10px;font-size:13px}
.b.gold{background:linear-gradient(180deg,#e9c46f,#b98d3a);color:#24190a;border-color:#8a6526}
.b.gold:hover:not(:disabled){background:linear-gradient(180deg,#f2d07c,#c69a45)}
.b.gold.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 0 0 4px rgba(220,178,90,.35)}}
button:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#view{position:relative;flex:1 1 auto;min-height:240px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0b110e;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(14,21,18,.78);color:var(--ink);font:700 20px/1 var(--font-body);cursor:pointer}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;padding:14px 16px;background:linear-gradient(90deg,transparent,rgba(9,13,11,.88) 22%,rgba(9,13,11,.88) 78%,transparent);animation:bin .3s ease-out;z-index:4}
#banner .bt{font-family:var(--font-display);font-size:clamp(28px,6vw,44px);line-height:1}
#banner .bs{font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-top:6px;color:var(--azure-2)}
#banner.R .bs{color:var(--crimson-2)}
@keyframes bin{from{opacity:0;transform:scaleY(.6)}}
#amenu{position:absolute;left:0;top:0;z-index:3;display:flex;flex-direction:column;gap:2px;padding:5px;min-width:136px;max-width:220px;background:rgba(14,20,17,.95);border:1px solid #6d5a2c;border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.55)}
#amenu button{display:flex;align-items:center;gap:9px;font:700 14px/1.1 var(--font-body);color:var(--ink);background:transparent;border:0;border-radius:7px;padding:9px 10px;min-height:38px;cursor:pointer;text-align:left}
#amenu button:hover,#amenu button:focus-visible{background:rgba(220,178,90,.16)}
#amenu button:disabled{opacity:.4;cursor:default}
#amenu button small{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}
#amenu svg{width:16px;height:16px;flex:none}
#amenu .atk{color:#ffb4a6}#amenu .heal{color:#c9f5b0}#amenu .def{color:#bcd8ff}#amenu .sk{color:#f3d488}
#amenu .sep{height:1px;background:var(--line);margin:3px 4px}
#side{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;max-height:44%;overflow:auto;min-width:0}
@media (min-width:880px){#stage{flex-direction:row}#side{flex:0 0 340px;max-height:none}}
.actions{display:grid;grid-template-columns:repeat(3,1fr) 1.25fr;gap:5px}
#card{padding:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:9px;min-height:120px}
.uc{display:flex;gap:12px;align-items:center}
.por{width:64px;height:64px;border-radius:10px;flex:none;background:#101814}
.ucm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.un{font-family:var(--font-display);font-size:21px;line-height:1}
.lv{font-family:var(--font-body);font-size:13px;color:var(--gold-2);font-weight:800;margin-left:6px}
.us{color:var(--muted);font-size:13px}
.hpl{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:13px}
.hpl .bar{flex:1;height:7px;background:rgba(0,0,0,.45);border-radius:4px;overflow:hidden}
.hpl .bar i{display:block;height:100%;background:var(--good)}
.hpl .bar i.mid{background:var(--hurt)} .hpl .bar i.low{background:var(--bad)}
.hpl .bar.xp i{background:var(--gold)}
.st{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0}
.st div{background:rgba(0,0,0,.22);border-radius:6px;padding:4px 2px;text-align:center}
.st dt{font-size:9.5px;letter-spacing:.1em;color:var(--muted)}
.st dd{margin:0;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;background:rgba(220,178,90,.13);color:var(--gold-2);border:1px solid rgba(220,178,90,.3)}
.tag.sk{background:rgba(141,181,242,.12);color:#c9dbff;border-color:rgba(141,181,242,.3)}
.tip{margin:0;font-size:13.5px;color:#d2d6c8}
.hint{margin:0;color:var(--muted);font-size:14px}
.fc{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px dashed var(--line);padding-top:9px}
.fc div{display:flex;flex-direction:column;gap:1px}
.fc span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fc b{font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.fc em{font-style:normal;font-size:12.5px;color:var(--muted)}
.fc .go{grid-column:1/-1;margin:0;font-size:13.5px;color:var(--gold-2)}
#logbox{padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px}
#logbox summary{font-family:var(--font-display);font-size:17px;cursor:pointer}
#statguide{padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;font-size:13.5px;line-height:1.45}
#statguide summary{font-family:var(--font-display);font-size:17px;cursor:pointer}
#statguide h4{margin:10px 0 4px;font-size:14px;color:var(--gold,#e4b64e)}
#statguide dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0}
#statguide dt{font-weight:800}#statguide dd{margin:0}
#statguide ul{margin:0;padding-left:18px}#statguide li{margin:2px 0}
#log{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px;max-height:220px;overflow:auto}
#log li{display:flex;gap:8px;align-items:baseline;color:#cfd4c6}
#log li::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;transform:translateY(-1px);background:var(--gold)}
#log li.B::before{background:var(--azure)} #log li.R::before{background:var(--crimson)}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;overflow:auto;padding-block:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#screen{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,rgba(10,16,13,.35),rgba(7,10,9,.9) 75%)}
#screen.titlebg{background:linear-gradient(90deg,rgba(7,10,9,.10),rgba(7,10,9,.38) 50%,rgba(7,10,9,.10)),var(--titleimg) center/cover no-repeat}
#screen.titlebg .sc{background:linear-gradient(180deg,rgba(24,34,30,.82),rgba(15,22,19,.88));max-width:440px;position:relative;left:6vw}
@media (max-height:500px){#screen.titlebg .sc{max-width:370px;left:5vw}#screen.titlebg .logo canvas{height:48px;width:auto}#screen.titlebg .logo .l1{font-size:38px;line-height:1.05}#screen.titlebg .logo .l0{font-size:13px}#screen.titlebg .sc>p{font-size:12px;margin:0}#screen.titlebg .sc{gap:8px;padding:12px 16px}}
.sc{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,rgba(31,43,38,.97),rgba(19,27,24,.98));border:1px solid var(--line);border-radius:14px;padding:22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.sc.wide{max-width:860px}
.sc h2{font-family:var(--font-display);font-weight:400;font-size:30px;margin:0;line-height:1.05;text-wrap:balance}
.sc h3{font-family:var(--font-display);font-weight:400;font-size:20px;margin:4px 0 0}
.sc p{margin:0;color:#cfd4c6}
.muted{color:var(--muted);font-size:14px}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .b{flex:1 1 auto}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.logo{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px}
.logo .l0{font-family:var(--font-display);font-size:20px;letter-spacing:.35em;color:var(--ink);padding-left:.35em}
.logo .l1{font-family:var(--font-display);font-size:clamp(46px,12vw,68px);line-height:.9;color:var(--gold-2);text-shadow:0 2px 0 #6b4c17,0 6px 18px rgba(0,0,0,.6)}
.logo canvas{width:120px;height:80px}
.obj{padding:10px 12px;border-left:3px solid var(--gold);background:rgba(220,178,90,.08);border-radius:0 8px 8px 0;font-size:14px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:grid;grid-template-columns:48px 1fr auto;gap:2px 12px;align-items:center;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--ink);cursor:pointer;font:inherit;width:100%}
.li:hover:not(:disabled){background:rgba(220,178,90,.08);border-color:#6d5a2c}
.li:disabled{opacity:.45;cursor:default}
.li.on{border-color:var(--gold);background:rgba(220,178,90,.12)}
.li canvas{width:48px;height:48px;border-radius:8px;grid-row:span 2;background:#101814}
.li .nm{font-weight:800;font-size:15px}
.li .ds{font-size:12.5px;color:var(--muted);grid-column:2}
.li .rt{grid-row:span 2;grid-column:3;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold-2)}
.tw{overflow-x:auto}
.tw table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.tw th,.tw td{padding:5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tw th{color:var(--muted);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.split{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.split{grid-template-columns:1.1fr 1fr}}
.gains{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gains div{background:rgba(0,0,0,.25);border-radius:8px;padding:6px 8px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.gains div.up{color:var(--gold-2);background:rgba(220,178,90,.14)}
/* town / world */
#town,#wmap{z-index:18;background:#0b120f;padding:0}
#tcv,#wcv{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:none}
.ttop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;background:linear-gradient(180deg,rgba(8,12,10,.75),transparent)}
.ttop>*{pointer-events:auto}
.ttitle{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--gold-2);text-shadow:0 2px 8px rgba(0,0,0,.8);flex:1;min-width:0}
.tbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-top:10px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(0deg,rgba(8,12,10,.9),transparent)}
.tbar .b{min-width:96px}
.winfo{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}

#dlg{z-index:30;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;background:linear-gradient(180deg,rgba(6,9,8,.2),rgba(6,9,8,.55) 55%,rgba(6,9,8,.9))}
.dbox{width:100%;max-width:780px;display:flex;gap:16px;align-items:center;background:linear-gradient(180deg,rgba(33,45,40,.97),rgba(18,26,23,.98));border:1px solid #6d5a2c;border-radius:14px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.6)}

.dtx{flex:1;min-width:0}
.dname{font-family:var(--font-display);font-size:22px;line-height:1.1;margin-bottom:4px}
.dname.B{color:var(--azure-2)} .dname.R{color:var(--crimson-2)} .dname.G{color:#9fe0ae}
.dtext{font-size:17px;line-height:1.5;min-height:3em}
.dbox.narr .dtext{font-style:italic;color:#e9dfc3;text-align:center}
.dhint{font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.06em}
.dchoices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.dskip{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
#toast{position:fixed;left:50%;top:max(18px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:rgba(14,20,17,.95);border:1px solid #6d5a2c;border-radius:10px;padding:10px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
@media (max-width:600px){#hud{gap:4px 10px;padding:6px 10px}.mobj{display:none}.mname{font-size:18px}.icon{width:34px;height:34px}#side{max-height:40%}.actions .b{padding:8px 3px;font-size:13px}#card{padding:10px;gap:7px}.tip{font-size:13px}#dpor{width:74px;height:74px}.dtext{font-size:15.5px}.dname{font-size:19px}.dbox{gap:12px;padding:12px}.ttitle{font-size:21px}.tbar .b{min-width:0;flex:1 1 28%}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(-90deg)}#banner{animation:none}.b.gold.nudge{animation:none}}

/* ---- landscape-only on phones ---- */
#rotate{display:none;position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#1f2b26,#0b110e);color:var(--ink);flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}

function unlockAudio(){if(!soundOn)return;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}}
function aout(node,vol,dur,t0){const gn=AC.createGain();gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(vol,t0+.008);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);node.connect(gn);gn.connect(AC.destination);}
function tone(f,dur,type,vol,f2,delay){const t0=AC.currentTime+(delay||0);const o=AC.createOscillator();o.type=type||'triangle';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);aout(o,vol||.06,dur,t0);o.start(t0);o.stop(t0+dur+.05);}
function noise(dur,vol,ft,fq,fq2,delay){const t0=AC.currentTime+(delay||0);if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.8|0,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(fq,t0);if(fq2)f.frequency.exponentialRampToValueAtTime(fq2,t0+dur);s.connect(f);aout(f,vol,dur,t0);s.start(t0);s.stop(t0+dur+.05);}

let UID=1;
function newRec(o){
 const c=CLS[o.cls];
 const r={uid:UID++,hero:o.hero||null,name:o.name,cls:o.cls,lv:o.lv||1,xp:0,s:{},acc:{},eq:{w:null,a:null,x:null},wounded:0,scar:0,kills:0,sk:o.sk||[],look:o.look||{},gb:o.gb||[0,0,0,0,0,0],guest:!!o.guest,joined:o.joined||0};
 STATS.forEach((k,i)=>{r.s[k]=o.s?o.s[i]:c.b[i]+Math.floor(c.g[i]*((r.lv)-1)/100);r.acc[k]=(hash(r.name+k)%60)+20;});
 if(o.eq){r.eq.w=o.eq[0];r.eq.a=o.eq[1];r.eq.x=o.eq[2];}
 else{r.eq.w=WDEF[o.cls]||null;r.eq.a=ADEF[o.cls]||null;}
 return r;
}
function heroRec(key){const h=HERO[key];return newRec({hero:key,name:h.n,cls:h.cls,lv:h.lv,s:h.s,gb:h.gb,eq:h.eq,sk:h.sk.slice(),look:Object.assign({},h.look),guest:h.guest});}
function genericRec(cls,lv,name){return newRec({cls,lv,name:name||GENERIC_NAMES[(UID*7+3)%GENERIC_NAMES.length]});}
function growth(r){const c=CLS[r.cls];return STATS.map((k,i)=>c.g[i]+(r.gb?r.gb[i]:0));}
// level up: returns gains object
function levelUp(r){
 r.lv++;const g=growth(r),gains={};
 STATS.forEach((k,i)=>{r.acc[k]+=g[i];let n=0;while(r.acc[k]>=100){r.acc[k]-=100;n++;}if(n){r.s[k]+=n;gains[k]=n;}});
 if(!Object.keys(gains).length){const k=STATS[r.lv%6];r.s[k]++;gains[k]=1;} // never a blank level
 return gains;
}
function promote(r,to){const c=CLS[to];const old=r.cls;r.cls=to;if(c.pb)STATS.forEach((k,i)=>r.s[k]+=c.pb[i]);
 const wt=CLS[to].wt;if(r.eq.w&&!wt.includes(IT[r.eq.w].wt)){BAG.add(r.eq.w);r.eq.w=null;const dw=Object.keys(IT).find(k=>IT[k].type==='weapon'&&wt.includes(IT[k].wt)&&IT[k].price>0);if(dw)r.eq.w=dw;}
 return old;}
function canPromote(r){const c=CLS[r.cls];return (c.promo||[]).filter(p=>r.lv>=p.lv&&(!p.hidden||BAG.has(p.item)));}

function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);}

/* ---------- Blender ground textures (art/tiles; packed as TILE_DATA) ----------
   Each texture is seamless and covers 4x4 tiles at 384 px, so it is laid as a world-aligned
   pattern. Other ground types are cut from it with a soft mask built at 4 px per tile and
   scaled up smoothly, so edges fade over about a quarter tile instead of a hard square. */
function texPat(t,k){const p=t.createPattern(TILEIMG[k],'repeat');p.setTransform(new DOMMatrix().scale(TS*4/TILEIMG[k].naturalWidth));return p;}
const LGK=['grass_dirt','bush','pine','bush_sh','pine_sh','rock','rock_sh'];
const LGDIRT='=BGEhbnx';          // map tiles drawn as Lost Garden dirt
function lgOn(){return G.mapStyle==='plains'&&typeof LGIMG!=='undefined'&&LGK.every(k=>imgOK(LGIMG[k]));}
function lgTree(r,c){return hash(G.mid+':'+r+','+c)%3?'bush':'pine';}
function drawLGTree(g,k,x,y){const I=LGIMG[k],sc=.55;g.drawImage(I,x-I.naturalWidth*sc/2,y-I.naturalHeight*sc,I.naturalWidth*sc,I.naturalHeight*sc);}
const TEXK=['grass','forest','dirt','crops','flagstone','cobble','slate','sand','snow','ice','mud'];
function texGround(t,T,rows,cols){
 const st=G.mapStyle,W=cols*TS,H=rows*TS;
 const LG=st==='plains'&&LGK.every(k=>imgOK(LGIMG[k]));
 // Lost Garden ground (Daniel Cook, CC-BY 3.0): hand-painted grass/dirt pieces on a dual grid - each piece
 // sits on a tile corner and takes its four corners from the four map tiles around it
 if(LG){const isD=ch=>ch&&LGDIRT.includes(ch),m=(r,c)=>isD(T(Math.min(Math.max(r,0),rows-1),Math.min(Math.max(c,0),cols-1)))?1:0;
  let sd=hash(G.mid+'lg');const rnd=()=>((sd=(sd*1664525+1013904223)>>>0)/4294967296);
  for(let vr=0;vr<=rows;vr++)for(let vc=0;vc<=cols;vc++){const i=m(vr-1,vc-1)*8+m(vr-1,vc)*4+m(vr,vc-1)*2+m(vr,vc);
   const x=vc*TS-TS/2,y=vr*TS-TS/2,full=i===0||i===15,rot=full?(rnd()*4|0):0,fx=full&&rnd()<.5;
   t.save();t.translate(x+TS/2,y+TS/2);t.rotate(rot*Math.PI/2);if(fx)t.scale(-1,1);t.drawImage(LGIMG.grass_dirt,(i%4)*48,((i/4)|0)*48,48,48,-TS/2,-TS/2,TS,TS);t.restore();}
  // soft shadows under trees and rocks, painted into the ground (three levels of transparency, as in the original set)
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const ch=T(r,c),x=c*TS+TS/2,y=r*TS;
   if(ch==='F'){const k=lgTree(r,c),S=LGIMG[k+'_sh'],sc=.55;t.drawImage(S,x-S.naturalWidth*sc*.5-4,y+TS*.62-S.naturalHeight*sc*.35,S.naturalWidth*sc,S.naturalHeight*sc);}
   if(ch==='o'){const S=LGIMG.rock_sh,sc=.9;t.drawImage(S,x-S.naturalWidth*sc*.5-3,y+TS*.62,S.naturalWidth*sc,S.naturalHeight*sc);}}}
 // the open ground of the whole map: grass, snow on snow maps, cobbles in town
 else{t.fillStyle=texPat(t,st==='snow'?'snow':st==='town'?'cobble':'grass');t.fillRect(0,0,W,H);}
 if(st==='fen'){t.fillStyle='rgba(40,52,32,.30)';t.fillRect(0,0,W,H);}
 // ragged, organic edges (owner's reference: hand-painted Zelda-like tiles): coverage is blended between
 // tile centres, pushed around by two octaves of value noise, then cut sharply; a dark band just inside
 // a sunken ground (dirt, mud, sand) reads as the grass lip casting a shadow
 let sd=hash(G.mid+'edge');const rnd=()=>((sd=(sd*1664525+1013904223)>>>0)/4294967296);
 const grid=(cell)=>{const gw=Math.ceil(W/cell)+2,gh=Math.ceil(H/cell)+2,v=new Float32Array(gw*gh);for(let i=0;i<v.length;i++)v[i]=rnd();
  return (x,y)=>{const fx=x/cell,fy=y/cell,ix=fx|0,iy=fy|0,ax=fx-ix,ay=fy-iy,sx=ax*ax*(3-2*ax),sy=ay*ay*(3-2*ay),k=iy*gw+ix;
   return (v[k]*(1-sx)+v[k+1]*sx)*(1-sy)+(v[k+gw]*(1-sx)+v[k+gw+1]*sx)*sy;};};
 const n1=grid(14),n2=grid(5);
 const NZ=new Float32Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++)NZ[y*W+x]=(n1(x,y)-.5)*.55+(n2(x,y)-.5)*.35;
 const cutLayer=(k,test,o={})=>{
  const cov=(r,c)=>r<0||r>=rows||c<0||c>=cols?(o.edgeOn?1:0):test(T(r,c))?1:0;let any=false;
  for(let r=0;r<rows&&!any;r++)for(let c=0;c<cols;c++)if(test(T(r,c))){any=true;break;}
  if(!any)return;
  const m=new ImageData(W,H),sh=o.shadow?new ImageData(W,H):null,amp=o.amp??1,thr=o.thr??.5;
  for(let y=0;y<H;y++){const fy=y/TS-.5,r0=Math.floor(fy),ay=fy-r0;
   for(let x=0;x<W;x++){const fx=x/TS-.5,c0=Math.floor(fx),ax=fx-c0;
    const v=(cov(r0,c0)*(1-ax)+cov(r0,c0+1)*ax)*(1-ay)+(cov(r0+1,c0)*(1-ax)+cov(r0+1,c0+1)*ax)*ay;
    if(v<=0)continue;const e=v+NZ[y*W+x]*amp*v*(1-v)*4-thr,i=(y*W+x)*4;
    const a=Math.max(0,Math.min(1,e*9+.5));m.data[i+3]=a*255;
    if(sh&&a>0){const b=Math.max(0,1-e/.14);sh.data[i+3]=Math.min(1,b)*a*255;}}}
  const mk=d=>{const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').putImageData(d,0,0);return c;};
  const L=document.createElement('canvas');L.width=W;L.height=H;const l=L.getContext('2d');
  l.fillStyle=texPat(l,k);l.fillRect(0,0,W,H);l.globalCompositeOperation='destination-in';l.drawImage(mk(m),0,0);
  t.drawImage(L,0,0,W,H);
  if(sh){const S=document.createElement('canvas');S.width=W;S.height=H;const s2=S.getContext('2d');s2.fillStyle=o.shadow;s2.fillRect(0,0,W,H);s2.globalCompositeOperation='destination-in';s2.drawImage(mk(sh),0,0);t.drawImage(S,0,0,W,H);}};
 // built ground keeps straight edges
 const hardLayer=(k,test)=>{t.save();t.beginPath();let any=false;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(test(T(r,c))){any=true;t.rect(c*TS,r*TS,TS,TS);}
  if(any){t.clip();t.fillStyle=texPat(t,k);t.fillRect(0,0,W,H);}t.restore();};
 const rim=(test,col)=>{t.strokeStyle=col;t.lineWidth=1.6;t.beginPath();
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(!test(T(r,c)))continue;const x=c*TS,y=r*TS;
   if(!test(T(r-1,c))){t.moveTo(x,y+.8);t.lineTo(x+TS,y+.8);}if(!test(T(r+1,c))){t.moveTo(x,y+TS-.8);t.lineTo(x+TS,y+TS-.8);}
   if(!test(T(r,c-1))){t.moveTo(x+.8,y);t.lineTo(x+.8,y+TS);}if(!test(T(r,c+1))){t.moveTo(x+TS-.8,y);t.lineTo(x+TS-.8,y+TS);}}t.stroke();};
 const ROADT=ch=>ch==='='||ch==='B'||ch==='G';
 if(st!=='snow'&&!LG)cutLayer('forest',ch=>ch==='F'||ch==='D',{amp:1.1});
 cutLayer('mud',ch=>ch==='~',{shadow:'rgba(30,26,14,.45)'});
 cutLayer('sand',ch=>ch===',',{shadow:'rgba(70,50,20,.30)',amp:.7});
 if(st!=='snow')cutLayer('snow',ch=>ch==='*');
 if(!LG)cutLayer('dirt',ROADT,{shadow:'rgba(40,28,12,.5)',thr:.55,amp:.55});
 hardLayer('ice',ch=>ch==='I');
 const crop=ch=>ch==='c';hardLayer('crops',crop);rim(crop,'rgba(80,60,25,.6)');
 hardLayer('flagstone',ch=>ch==='R'||ch==='T'||ch==='G'||ch==='#');
 hardLayer('slate',ch=>ch==='r'||ch==='p');
 return true;
}

/* ================= TOWN + WORLD ART ================= */
// Scenes are drawn in a 1000x620 virtual space. Static layers are baked once per key (2x) into TZ_CACHE;
// only animated bits (smoke, flags, water, fire, walkers, birds, mist, glows) are drawn per frame.
const TZW=1000,TZH=620,TZ_CACHE={};
function tzLG(g,x0,y0,x1,y1,st){const gr=g.createLinearGradient(x0,y0,x1,y1);st.forEach((c,i)=>Array.isArray(c)?gr.addColorStop(c[0],c[1]):gr.addColorStop(i/Math.max(1,st.length-1),c));return gr;}
function tzRG(g,x,y,r,st,r0){const gr=g.createRadialGradient(x,y,r0||0,x,y,Math.max(1,r));st.forEach((c,i)=>Array.isArray(c)?gr.addColorStop(c[0],c[1]):gr.addColorStop(i/Math.max(1,st.length-1),c));return gr;}
function tzPoly(g,p){g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();}
function tzBlob(g,p){const n=p.length,m=i=>[(p[i%n][0]+p[(i+1)%n][0])/2,(p[i%n][1]+p[(i+1)%n][1])/2];g.beginPath();const s=m(n-1);g.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const e=m(i);g.quadraticCurveTo(p[i][0],p[i][1],e[0],e[1]);}g.closePath();}
function tzCurve(g,p){g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++){const a=p[i],b=p[i+1];g.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}const l=p[p.length-1];g.lineTo(l[0],l[1]);}
function tzDot(g,x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill();}

/* ---------- sky & land ---------- */
function tzSky(g,h,st){g.fillStyle=tzLG(g,0,0,0,h,st);g.fillRect(0,0,TZW,h+60);}
function tzSun(g,x,y,r,col,glow){g.fillStyle=tzRG(g,x,y,r*6,[glow,'rgba(255,240,200,0)']);g.fillRect(x-r*6,y-r*6,r*12,r*12);tzDot(g,x,y,r,col);}
function tzCloud(g,x,y,s,c1,c2){const P=[[-34,4,13],[-18,-6,18],[2,-13,22],[24,-6,17],[40,4,12],[0,4,16]];
 g.fillStyle=c2||'rgba(196,170,190,.55)';g.beginPath();for(const [dx,dy,r] of P){g.moveTo(x+(dx+r)*s,y+(dy+5)*s);g.arc(x+dx*s,y+(dy+5)*s,r*s,0,7);}g.fill();
 g.fillStyle=c1||'#fff9ef';g.beginPath();for(const [dx,dy,r] of P){g.moveTo(x+(dx+r)*s,y+dy*s);g.arc(x+dx*s,y+dy*s,r*s,0,7);}g.fill();}
function tzRidge(g,R,y,amp,step,fill,ol){const p=[];for(let x=-60;x<=1060;x+=step)p.push([x,y-R()*amp]);g.beginPath();g.moveTo(-60,TZH+10);g.lineTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i];g.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}g.lineTo(1060,TZH+10);g.closePath();g.fillStyle=fill;g.fill();if(ol){g.strokeStyle=ol;g.lineWidth=1.5;g.stroke();}}
function tzPeak(g,cx,base,h,w,col,snow,lw){
 g.beginPath();g.moveTo(cx-w,base);g.lineTo(cx-w*.35,base-h*.7);g.lineTo(cx,base-h);g.lineTo(cx+w*.4,base-h*.62);g.lineTo(cx+w,base);g.closePath();g.fillStyle=col;g.fill();if(lw){g.strokeStyle=OL;g.lineWidth=lw;g.stroke();}

// tapping empty ground (or off the map) with a unit selected: clear the target, or deselect;
// after a move, the unit ends its turn where it stands (Undo can still take it back)
function emptyTap(){if(!G||!G.started||G.busy||G.over||!human())return;const C=ctx(),sel=C.sel;
 if(!sel){if(G.inspect){G.inspect=null;ui();}return;}
 if(G.target||G.wallAim||G.aim||G.aimItem||G.peek){const it=G.aimItem;G.target=null;G.wallAim=null;G.aim=null;G.aimItem=null;G.peek=null;if(it)menuMode='items';menuKey='';sfx('tick');ui();return;}
 if(G.phase==='select'){clearSel();sfx('tick');ui();return;}
 if(G.phase==='moved'){park(sel);stayDefend(sel);finish(sel);}}
async function onTap(r,c){
 if(!G||!G.started||G.busy||G.over||!human())return;
 const u=unitAt(r,c),vu=u&&seenByPlayer(u)?u:null,C=ctx(),sel=C.sel;
 const wa=G.wallAim;G.wallAim=null;   // a cracked wall picked last tap (R-073); any other tap drops it
 // peeking at a skill that can't be used: any tap goes back to the menu
 if(G.peek){G.peek=null;menuKey='';sfx('tick');ui();return;}
 // item aiming: the user or an adjacent ally
 if(G.aimItem&&sel){const k=G.aimItem.k,hit=itemTargets(sel,k).find(t=>t.r===r&&t.c===c);
  if(!hit||!hit.ok){G.aimItem=null;menuMode='items';menuKey='';sfx('tick');ui();return;}
  G.aimItem=null;G.undo=[];G.busy=true;ui();await useItem(sel,k,hit.u);G.busy=false;menuMode='main';finish(sel);return;}
 // skill aiming
 if(G.aim&&sel){const k=G.aim.sk,ts=skillTargets(sel,k),hit=ts.find(t=>t.r===r&&t.c===c);
  if(!hit){G.aim=null;G.target=null;sfx('tick');ui();return;}
  const needsConfirm=SK[k].tgt==='enemy'||SK[k].tgt==='tile';
  if(needsConfirm&&!(G.aim.t&&G.aim.t.r===r&&G.aim.t.c===c)){G.aim.t=hit;G.target=hit.u?hit.u.id:null;sfx('tick');ui();return;}
  G.undo=[];G.busy=true;G.aim=null;G.target=null;ui();await useSkill(sel,k,hit);G.busy=false;if(G.over)return;
  if(!sel.dead){if(k==='haul'&&!sel.carrying&&false){}finish(sel);}else{clearSel();ui();}return;}
 if(G.phase==='canto'&&sel){if(G.canto.ends.has(r+','+c)&&(!u||u===sel)){if(u!==sel){const path=pathTo(G.canto,r,c);G.busy=true;await walk(sel,path);await landOn(sel);G.busy=false;}finish(sel);}return;}
 if(!sel){
  if(vu&&vu.side==='B'&&!vu.done)select(vu);
  else{G.inspect=vu?{unit:vu.id}:{r,c};sfx('tick');ui();}
  return;}
 if(G.phase==='select'){
  if(vu&&!friendly(vu.side,sel.side)&&targetsFrom(sel,sel.r,sel.c,false).includes(vu)){G.phase='moved';G.from=[sel.r,sel.c];sel.moved=false;return targetTap(sel,vu);}
  if(vu&&friendly(vu.side,sel.side)&&vu!==sel&&C.heals.includes(vu)){G.phase='moved';G.from=[sel.r,sel.c];return doHeal(sel,vu);}
  if(!u&&wallTargetsFrom(sel,sel.r,sel.c,false).some(t=>t.r===r&&t.c===c)){G.phase='moved';G.from=[sel.r,sel.c];sel.moved=false;return wallTap(sel,r,c,wa);}
  const k=r+','+c;
  if(C.reach.ends.has(k)&&(!u||u===sel||!vu)){
   if(u===sel){G.phase='moved';G.from=[sel.r,sel.c];sel.moved=false;ui();return;}
   const path=pathTo(C.reach,r,c);G.from=[sel.r,sel.c];sel.moved=true;G.phase='moved';G.target=null;G.busy=true;G.hover=null;ui();
   const res=await walk(sel,path);await landOn(sel);G.busy=false;
   if(G.over)return;
   if(res.stop||sel.gone){if(res.stop)G.from=null;if(sel.gone){finish(sel);checkEnd();return;}}
   ui();return;}
  if(vu&&vu.side==='B'&&!vu.done)return select(vu);
  clearSel();G.inspect=vu?{unit:vu.id}:{r,c};ui();return;}
 if(G.phase==='moved'){
  if(u===sel){park(sel);stayDefend(sel);return finish(sel);}
  if(vu&&!friendly(vu.side,sel.side)&&C.targets.includes(vu))return targetTap(sel,vu);
  if(vu&&friendly(vu.side,sel.side)&&C.heals.includes(vu))return doHeal(sel,vu);
  if(vu&&vu.side==='B'&&!vu.done){park(sel);stayDefend(sel);finish(sel);return select(vu);}
  if(!u&&wallTargetsFrom(sel,sel.r,sel.c,sel.moved).some(t=>t.r===r&&t.c===c))return wallTap(sel,r,c,wa);
  if(G.target||G.aim||wa){G.target=null;G.aim=null;sfx('tick');ui();return;}if(!vu){emptyTap();return;}ui();}
}
async function targetTap(sel,u){
 if(G.target===u.id){G.undo=[];G.busy=true;ui();await strike(sel,u);if(G.over)return;G.busy=false;
  if(!sel.dead){if(has(sel,'hitrun')&&movOf(sel)-(sel.movedTiles||0)>0){const save=sel.buffs.mov||0;sel.buffs.mov=save-(sel.movedTiles||0);G.canto=reachOf(sel);sel.buffs.mov=save;G.phase='canto';G.target=null;ui();return;}finish(sel);}else{clearSel();ui();}}
 else{G.target=u.id;sfx('tick');ui();}
}
// R-073: first tap on a cracked wall in reach picks it (forecast shows), the second tap strikes it
async function wallTap(sel,r,c,wa){
 if(wa&&wa.r===r&&wa.c===c&&wa.id===sel.id){G.undo=[];G.busy=true;G.target=null;ui();await strikeWall(sel,r,c);G.busy=false;if(G.over)return;if(!sel.dead)finish(sel);else{clearSel();ui();}}
 else{G.wallAim={r,c,id:sel.id};G.target=null;sfx('tick');ui();}}
async function doHeal(p,a){G.undo=[];G.busy=true;ui();await useSkill(p,'heal',{u:a});G.busy=false;finish(p);}
/* ================= ACTION MENU ================= */
const IC={atk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 4 L9 14 M6 11 L13 18 M8 16 L4 20"/></svg>',

const amenu=$('#amenu');let menuKey='',menuMode='main';
function renderMenu(C){
 const on=canAct()&&C.sel&&G.phase==='moved'&&!G.target&&!G.wallAim&&!G.aim&&!G.aimItem&&!G.peek;
 if(!on){amenu.hidden=true;menuKey='';menuMode='main';return;}
 const u=C.sel,items=[];
 if(menuMode==='main'){
  if(C.targets.length)items.push(['atk','Attack','atk']);
  if(C.heals.length)items.push(['heal','Heal','heal']);
  const sks=u.sk.filter(k=>SK[k]&&SK[k].kind==='active'&&k!=='heal'&&!(SK[k].tgt==='enemy'&&k!=='pilfer'&&k!=='leap'&&u.moved&&false));
  for(const k of sks){const n=skillTargets(u,k).length;if(k==='haul'&&u.carrying)items.push(['sk:'+k,'Set down','sk','',n?0:1]);else items.push(['sk:'+k,SK[k].n,n?'sk':'sk off',SK[k].uses>=99?'':(u.uses[k]||0)+'/'+SK[k].uses,0]);}
  const usable=Object.keys(BAG.items).filter(k=>IT[k].type==='use');if(usable.length&&u.side==='B')items.push(['items','Item','item']);
  if(!u.moved)items.push(['def','Defend','def']);
 }else if(menuMode==='items'){for(const k of Object.keys(BAG.items).filter(k=>IT[k].type==='use'))items.push(['use:'+k,IT[k].n,'item','×'+BAG.items[k]]);items.push(['back','Back','def']);}
 if(!items.length){amenu.hidden=true;menuKey='';return;}
 const key=u.id+menuMode+items.map(i=>i[0]+i[3]+i[4]).join();
 if(key!==menuKey){amenu.innerHTML=items.map(([k,l,c,sm,dis])=>`<button data-act="${k}" class="${c}" ${dis?'disabled':''}>${IC[c]||IC.sk}<span>${esc(l)}</span>${sm?`<small>${sm}</small>`:''}</button>`).join('');menuKey=key;}
 amenu.hidden=false;placeMenu();
}
// Place the action menu beside the selected unit where it covers the fewest units: enemies count most
// (attack targets above all), then allies. Tries right, left, above and below, next to the unit or one tile out.
function placeMenu(){if(amenu.hidden||!G)return;const u=byId(G.sel);if(!u){amenu.hidden=true;return;}
 const z=cam.z,T=TS*z,w=amenu.offsetWidth||136,h=amenu.offsetHeight||160,C=ctx();
 const tx=(u.c*TS-cam.x)*z,ty=(u.r*TS-cam.y)*z,cx=tx+T/2,cy=ty+T/2,tg=new Set((C.targets||[]).map(t=>t.id));
 const boxes=[];for(const v of G.units){if(v.dead||v.gone||!seenByPlayer(v))continue;

function itemDesc(k){const it=IT[k];const p=[];if(it.type==='weapon')p.push(`${it.wt} · might ${it.mt}`);if(it.def)p.push(`DEF +${it.def}`);if(it.res)p.push(`RES +${it.res}`);if(it.atk)p.push(`ATK +${it.atk}`);if(it.spd)p.push(`SPD ${it.spd}`);if(it.mov)p.push(`MOV +${it.mov}`);if(it.d)p.push(it.d);return p.join(' · ');}
function itemIcons(root){for(const c of (root||scr).querySelectorAll('canvas[data-item]')){const k=c.dataset.item,it=IT[k],p=c.getContext('2d');p.setTransform(2,0,0,2,0,0);p.clearRect(0,0,48,48);const gr=p.createRadialGradient(24,24,2,24,24,30);gr.addColorStop(0,'#2a3a33');gr.addColorStop(1,'#101814');p.fillStyle=gr;p.fillRect(0,0,48,48);
 const PI_=typeof ICONIMG!=='undefined'&&ICONIMG[k];if(PI_){if(PI_.complete&&PI_.naturalWidth){p.drawImage(PI_,3,3,42,42);continue;}PI_.addEventListener('load',()=>itemIcons(root),{once:true});}
 if(!it)continue;   // painted icon (2026-11-18); drawn icon below is the fallback
 p.translate(24,34);
 const L={weapon:{sword:'sword',lance:'spear',bow:'bow',xbow:'xbow',dagger:'dagger',club:'club'}[it.wt]};
 if(it.type==='weapon'&&it.wt==='tome'){p.beginPath();p.roundRect(-10,-26,20,24,3);sh(p,it.el==='fire'?'#a3402a':it.el==='frost'?'#3a6a9a':'#6a4a9a');p.fillStyle=GOLD;p.fillRect(-2,-18,4,8);}
 else if(it.type==='weapon'&&it.wt==='staff'){pole(p,-8,0,8,-26,WOOD,3);p.beginPath();p.arc(8,-28,4.5,0,7);sh(p,'#bfe8ff');}
 else if(it.type==='weapon'&&L.weapon){p.save();p.scale(.9,.9);p.translate(-8,6);try{weapon(p,PAL.B,{weapon:L.weapon},{id:0},0);}catch(e){}p.restore();}
 else if(it.type==='weapon'){p.beginPath();p.arc(0,-12,8,0,7);sh(p,'#c9a27a');}
 else if(it.type==='armor'){p.beginPath();p.roundRect(-9,-22,18,18,5);sh(p,grad(p,'ia'+k,-9,-22,9,-4,it.def>=3?METAL:it.res>=2?'#5a3a8a':'#7a5233'));}
 else if(it.type==='acc'){p.beginPath();p.arc(0,-12,7,0,7);p.lineWidth=3;p.strokeStyle=GOLD;p.stroke();p.beginPath();p.arc(0,-19,2.6,0,7);sh(p,'#d0384a',1);}
 else if(it.type==='use'){p.beginPath();p.moveTo(-5,-26);p.lineTo(5,-26);p.lineTo(5,-20);p.lineTo(9,-14);p.lineTo(9,-2);p.lineTo(-9,-2);p.lineTo(-9,-14);p.lineTo(-5,-20);p.closePath();sh(p,k==='torch'?'#c9a24a':k==='holywater'?'#cfe8ff':'#7fd067');}
 else if(k==='ember_feather'){p.beginPath();p.moveTo(0,-30);p.quadraticCurveTo(10,-14,0,0);p.quadraticCurveTo(-10,-14,0,-30);sh(p,'#ff7a2e');}
 else{p.beginPath();p.moveTo(0,-28);p.lineTo(8,-14);p.lineTo(0,0);p.lineTo(-8,-14);p.closePath();sh(p,GOLD);}}}

/* ================= GEAR: comparisons, shop with confirm, party gear (2026-11-15) ================= */
const SLOT_OF={weapon:'w',armor:'a',acc:'x'},SLOT_N={w:'Weapon',a:'Armor',x:'Accessory'};
const recName=r=>r.hero?HERO[r.hero].n:r.name;
function canWear(r,k){const it=IT[k];if(!it)return false;if(it.type==='weapon')return CLS[r.cls].wt.includes(it.wt);return it.type==='armor'||it.type==='acc';}
// the numbers that matter in battle for a roster record wearing `eq` (no terrain, no buffs)
function gearStats(r,eq){const m={s:r.s,eq,buffs:{},cls:r.cls,sk:r.sk||[],frozen:0},w=eq.w?IT[eq.w]:null,o={};
 if(w&&w.wt==='staff')o.heal=(w.mt||0)+stat(m,'mag');
 else if(w){const mag=w.wt==='tome'||((r.sk||[]).includes('runeedge')||(CLS[r.cls].sk||[]).includes('runeedge'))&&w.wt==='sword';o[mag?'mpow':'pow']=(mag?stat(m,'mag'):stat(m,'atk'))+(w.mt||0);
  if(w.wt==='bow'||w.wt==='xbow')o.rng=Math.max(2,CLS[r.cls].rng[1])+(w.rng||0);}
 o.def=stat(m,'def');o.res=stat(m,'res');o.spd=stat(m,'spd');o.mov=movOf(m);return o;}
const GS_N={pow:'Attack',mpow:'Magic attack',heal:'Healing',rng:'Range',def:'DEF',res:'RES',spd:'SPD',mov:'Move'};
// chips comparing what r has now in that slot against item k (or against nothing when k is null)
function gearCmp(r,k,slot){slot=slot||SLOT_OF[IT[k].type];const a=gearStats(r,r.eq),eq=Object.assign({},r.eq);eq[slot]=k;const b=gearStats(r,eq),out=[];
 for(const key of Object.keys(GS_N)){const x=a[key],y=b[key];if(x===y)continue;
  if(x==null){out.push(`<span class="gc up">${GS_N[key]} ${y}</span>`);continue;}
  if(y==null){out.push(`<span class="gc dn">No ${GS_N[key].toLowerCase()}</span>`);continue;}
  const d=y-x;out.push(`<span class="gc ${d>0?'up':'dn'}">${GS_N[key]} ${x}→${y} (${d>0?'+':'−'}${Math.abs(d)})</span>`);}
 return out.length?out.join(''):'<span class="gc">No change</span>';}
function gearLine(r){return ['w','a','x'].map(s=>`<span class="gq"><b>${{w:'Weapon',a:'Armor',x:'Acc.'}[s]}</b> ${r.eq[s]?esc(IT[r.eq[s]].n):'<span class="muted">—</span>'}</span>`).join('');}
function partyGear(){return `<div class="list">${CAMP.roster.filter(x=>!x.guest).map(r=>`<div class="li" style="cursor:default"><canvas width="96" height="96" data-rec="${r.uid}"></canvas><span class="nm">${esc(recName(r))} <span class="lv">Lv ${r.lv} · ${esc(CLS[r.cls].n)}</span></span><span class="ds">${gearLine(r)}</span><span class="rt"></span></div>`).join('')}</div>`;}

function openShop(key,filter){

  show(`${head()}${tabs}${body}<div class="row"><button class="b gold" id="spDone">Done</button></div>`,true);itemIcons();miniPortraits();
  for(const b of scr.querySelectorAll('[data-t]'))b.onclick=()=>{tab=b.dataset.t;sfx('tick');render();};

  $('#spDone').onclick=closePanel;};
 const detail=()=>{const k=pick,it=IT[k],slot=SLOT_OF[it.type],buying=tab==='buy',price=buying?it.price:sellPrice(k),afford=CAMP.gold>=price,own=BAG.items[k]||0;

  show(`${head()}<div class="row" style="align-items:center"><span class="eyebrow">${buying?'Buy':'Sell'}</span>${goldChip()}</div>

   ${slot?`<h3 style="margin:4px 0 0">${buying?'On your party':'Who could wear it'}</h3><div class="list">${rows}</div>`:''}`,true);itemIcons();miniPortraits();

 render();
}

// what a record's gear adds to each stat: weapon might goes on ATK (or MAG for tomes and spellblades), a staff's might is healing
function gearBonus(r){const o={atk:0,mag:0,def:0,res:0,spd:0,hp:0,mov:0,heal:0},w=r.eq.w?IT[r.eq.w]:null;
 for(const s of ['a','x']){const it=r.eq[s]?IT[r.eq[s]]:null;if(!it)continue;for(const k of ['atk','mag','def','res','spd','hp'])if(it[k])o[k]+=it[k];if(it.mov)o.mov+=it.mov;}
 if(w){if(w.wt==='staff')o.heal+=w.mt||0;else{const g0=gearStats(r,Object.assign({},r.eq,{w:null})),g1=gearStats(r,r.eq);if(g1.mpow!=null)o.mag+=w.mt||0;else o.atk+=w.mt||0;}}
 return o;}
const gb=n=>n?`<small class="${n>0?'gup':'gdn'}">(${n>0?'+':'−'}${Math.abs(n)})</small>`:'';
function statCells(r){const b=gearBonus(r),cells=STATS.map(k=>`<div><span>${STATN[k]}</span><b>${r.s[k]}${gb(b[k])}${k==='mag'&&b.heal?`<small class="gup">(+${b.heal} heal)</small>`:''}</b></div>`);
 return cells.join('')+`<div><span>MOV</span><b>${CLS[r.cls].mv}${gb(b.mov)}</b></div>`;}

/* ================= STAY = DEFEND, SKILL INFO, ITEM TARGETING (2026-11-15) ================= */
// A unit that ends its turn without moving or acting braces automatically (+3 DEF until its next turn).
function stayDefend(u,quiet){if(!u||u.moved||u.defend||u.dead)return;u.defend=true;if(!quiet){ring(u.x,u.y,'#9cc8ff');logm(`${u.name} holds position and braces.`,'B');}}
// tiles within distance a..b of the unit
function ringTiles(u,a,b){const o=[];for(let r=u.r-b;r<=u.r+b;r++)for(let c=u.c-b;c<=u.c+b;c++){if(!inMap(r,c))continue;const d=dist(r,c,u.r,u.c);if(d>=a&&d<=b)o.push([r,c]);}return o;}
const AREA_TXT={cross:'the target tile and the 4 around it',sq3:'a 3×3 area',adj:'the 4 tiles next to the user',r2:'everything within 2 tiles of the user'};
// where a skill can reach from where the unit stands, as tiles and as words
function skillReach(u,k){const d=SK[k];let a=1,b=1,txt='';
 switch(d.tgt){
  case 'self':{const t=d.area?areaTiles(d.area,u.r,u.c):[];t.push([u.r,u.c]);return {tiles:t,txt:d.area?'Affects '+AREA_TXT[d.area]:'Affects the user only'};}
  case 'enemy':if(k==='pilfer'){a=b=1;}else if(k==='leap'){a=b=2;}else{const rg=rangeOf(u,u.r,u.c,u.moved)||[1,1];a=rg[0];b=rg[1];}txt='An enemy';break;
  case 'ally':[a,b]=(k==='heal'||k==='mend')?healRange(u,k):(d.rng||[1,1]);txt=k==='timefold'||k==='haste'?'An ally who has already acted':'An ally';break;
  case 'carry':txt=u.carrying?'An empty tile next to the user':'An ally next to the user (not mounted or heavy)';break;
  case 'tile':[a,b]=d.rng||[1,3];txt='A tile'+(d.area?', hitting '+AREA_TXT[d.area]:'');break;
  case 'fallen':txt='A fallen ally returns to a tile next to the user';break;
 }
 return {tiles:ringTiles(u,a,b),txt:`${txt} · range ${a===b?a:a+'–'+b}`};}
function skillStatus(u,k){const d=SK[k];if(d.uses<99&&(u.uses[k]||0)<=0)return 'No uses left this battle.';
 const n=skillTargets(u,k).length;if(n)return d.tgt==='tile'||d.tgt==='enemy'?'Tap a highlighted target, then tap it again to confirm.':'Tap a highlighted target.';
 return d.tgt==='enemy'?'No enemy in range from here.':d.tgt==='ally'?'No ally in range who can use it right now.':d.tgt==='fallen'?'No fallen ally to call back.':'Nothing to use it on from here.';}
// targets for an item: the user, and allies standing next to it
function itemTargets(u,k){const it=IT[k],out=[u,...alliesOf(u).filter(a=>!a.carried&&dist(a.r,a.c,u.r,u.c)===1)];
 return out.map(t=>({r:t.r,c:t.c,u:t,ok:it.heal?t.hp<t.s.hp:!(it.buff&&t.buffs&&t.buffs[it.buff])}));}

 else if(u&&G.aimItem){const k=G.aimItem.k,it=IT[k];h=`<div class="sn">${esc(it.n)} <small>×${BAG.items[k]||0}</small></div><div class="sr">The user or an ally next to it · range 0–1</div><div class="sd">${esc(itemDesc(k))}</div><div class="ss">${itemTargets(u,k).some(t=>t.ok)?'Tap a green unit to use it.':'Nobody here needs it right now.'} Tap elsewhere to go back.</div>`;}

/* ================= TRIPO SPRITES (art pipeline, 2026-11-16) =================

const SPR={},BGIMG={},PROPIMG={},TILEIMG={},TOWNIMG={},LGIMG={},MAPIMG={},OBJIMG={},WORLDIMG={},ICONIMG={};

 hollowmere:{army:[103,284,80],shop:[321,272,75],smith:[545,242,70],talk:[508,400,60],chapel:[787,321,75],yard:[157,448,85],depart:[926,484,60]},

 tower:{army:[170,185,90,85],talk:[440,320,55,55],shop:[690,290,70,75],chapel:[880,445,80,80],yard:[205,455,75,70],depart:[860,95,70,80]}
};
(function(){
 const load=src=>{const im=new Image();im.decoding='async';im.src=src;return im;};
 for(const [k,s] of Object.entries(typeof SPRITE_DATA!=='undefined'?SPRITE_DATA:{}))
  {SPR[k]={cls:s.cls,an:s.an||0,map:load(s.map),mapA:s.mapA,bat:load(s.battle),batA:s.batA,port:s.port?load(s.port):null,face:s.face?load(s.face):null};
  if(s.dirs){SPR[k].dirs={};for(const [d,v] of Object.entries(s.dirs))SPR[k].dirs[d]={img:load(v.img),a:v.a};}
  if(s.anim){SPR[k].anim={};for(const [c,vs] of Object.entries(s.anim)){SPR[k].anim[c]={};for(const [v,d] of Object.entries(vs))SPR[k].anim[c][v]={fps:d.fps,hit:d.hit,f:d.f.map(x=>({img:load(x.img),a:x.a}))};}}
  if(s.near){SPR[k].near={};for(const [f,v] of Object.entries(s.near))SPR[k].near[f]={img:load(v.img),a:v.a,tip:v.tip};}
  for(const rk of ['retro','retroR'])if(s[rk]){SPR[k][rk]={};for(const [d,v] of Object.entries(s[rk]))SPR[k][rk][d]={img:load(v.img),a:v.a};}
  if(s.frames){SPR[k].frames={};for(const [f,v] of Object.entries(s.frames))SPR[k].frames[f]={img:load(v.img),a:v.a,tip:v.tip,m:v.m?load(v.m):null,ma:v.ma,mtip:v.mtip};}}
 for(const [k,s] of Object.entries(typeof BG_DATA!=='undefined'?BG_DATA:{}))BGIMG[k]=load(s);
 for(const [k,s] of Object.entries(typeof TILE_DATA!=='undefined'?TILE_DATA:{}))TILEIMG[k]=load(s);
 for(const [k,s] of Object.entries(typeof LG_DATA!=='undefined'?LG_DATA:{}))LGIMG[k]=load(s);
 for(const [k,s] of Object.entries(typeof MAP_DATA!=='undefined'?MAP_DATA:{}))MAPIMG[k]=load(s);
 for(const [k,s] of Object.entries(typeof OBJ_DATA!=='undefined'?OBJ_DATA:{}))OBJIMG[k]=load(s);

 for(const [k,s] of Object.entries(typeof PROP_DATA!=='undefined'?PROP_DATA:{}))PROPIMG[k]={map:load(s.map),mapA:s.mapA};
 for(const [k,src] of Object.entries(typeof TOWN_DATA!=='undefined'?TOWN_DATA:{})){

  if(P&&TOWNS[k])for(const sp of TOWNS[k].spots){const q=P[sp.id];if(q){sp.x=q[0];sp.y=q[1];sp.r=q[2];sp.ly=q[3]!=null?q[3]:undefined;}}}
})();
const imgOK=im=>im&&im.complete&&im.naturalWidth>0;
// hero sprite when the hero is in the class it was made for, else the class sprite
function spriteFor(u){
 if(!u)return null;
 if(u.hero){const h=SPR['hero_'+u.hero];if(h&&h.cls===u.cls&&imgOK(h.map))return h;
  const p=SPR['hero_'+u.hero+'_'+u.cls];if(p&&imgOK(p.map))return p;}   // promoted: the hero's head on the new class body (tools/art/head_swap.py)
 const c=SPR['cls_'+u.cls];return c&&imgOK(c.map)?c:null;}
// draw a sprite with the feet at (0,0); 1 world unit = 1 game px at 48 px tiles.
// Map sprites are made at 2 px per unit (front three-quarter view); battle sprites at 4 (side-on).
// retro map figures (owner 2026-11-18, Dragon Knight II style): small crisp chibi sprites on the map,
// the painted 3D sprites stay in the battle view. Setting: the figure button in Settings (ec-retro).
let RETRO_ON=LS.get('ec-retro',1);
function retroImg(S,u){const R=(u&&u.side==='R'&&S.retroR)||S.retro;if(!R)return null;
 const d=u&&u.dir&&R[u.dir]&&imgOK(R[u.dir].img)?R[u.dir]:R.map;return d&&imgOK(d.img)?d:null;}
/* 2D key-frame motion (owner decision 2026-11-19). Six painted frames per unit: idle = ready<->breath with a small
   breathing squash; run = charge frame with a stride bob and lean; attack = wind-up -> strike (hit) -> recover with a short
   lunge. Feet stay at (0,0); +x is forward (sprites face screen-right before the face flip). t: clip seconds, i: tick, n: ticks. */
function anim2dMove(g,k,t,i,n,V,p){
 if(k==='idle'){const p=Math.sin(t*Math.PI*2/(n/V.fps));g.scale(1-.008*p,1+.014*p);}
 else if(k==='run'&&V.rc){const x=p!=null?Math.min(n-1e-6,p*n):(t*V.fps)%n,j=Math.floor(x),u=V.s[j]%2?Math.sin(Math.PI*(x-j)):0;   // 4-frame run cycle: body rises on the passing frames R1/R3, down on the foot strikes R0/R2 (2026-11-19)
  g.translate(0,-2.2*u);g.rotate(.04);g.scale(1+.015*(1-u),1-.02*(1-u));}
 else if(k==='run'){const st=Math.abs(Math.sin(t*Math.PI*5.5));g.translate(0,-2.4*st);g.rotate(.05);g.scale(1+.02*(1-st),1-.025*(1-st));}
 else if(k==='attack'){const s=V.s,a=s.indexOf(1),b=s.indexOf(2),x=t*V.fps;let L;   // ticks: wind-up [0,a), strike [a,b), recover [b,n)
  if(x<a)L=0;                                                                 // hold on the wind-up (owner 2026-11-19 22:19: no step back after the run-in)
  else if(x<b)L=10*Math.min(1,(x-a)/Math.max(1,(b-a)*.6));                    // lunge into the strike
  else L=10-6*Math.min(1,(x-b)/Math.max(1,n-b));                              // ease back on the recover
  g.translate(L,0);if(x>=a&&x<b)g.scale(1.03,.98);}}

  {w:'kael',x:'Jin. Your lord’s dead and you still keep his oath. Doesn’t it chafe?'},
  {w:'jin',x:'Every day. Like a ring that no longer fits.'},
  {w:'kael',x:'My father made me swear to guard Rowan. Then he died. I can’t ask him what he meant.'},
  {w:'jin',x:'Then you must decide what he meant. That is harder.'},
  {w:'kael',x:'Easier to just obey.'},
  {w:'jin',x:'Easier. Not lighter.'}
 ]},
 {id:'nobody_owns',after:'m18',title:'Nobody Owns Her',who:['seren', 'rowan'],lines:[
  {w:'seren',x:'Gale doesn’t like many people. She landed beside you twice today.'},
  {w:'rowan',x:'Maybe she likes the smell of horses.'},
  {w:'seren',x:'Maybe. My mother has three suitors for me lined up. Gale bit two of them.'},
  {w:'rowan',x:'And the third?'},
  {w:'seren',x:'Hasn’t been near enough yet. She’s very patient.'},
  {w:'rowan',x:'Should I be worried?'},
  {w:'seren',x:'You should be worried she bites you. Not that she might stay.'}
 ]},
 {id:'a_name',after:'m19',title:'A Name',who:['kael', 'rowan'],lines:[
  {w:'kael',x:'The dwarves followed the name. So did the elves. You noticed.'},
  {w:'rowan',x:'I noticed.'},
  {w:'kael',x:'And for a moment you liked it. Admit it.'},
  {w:'rowan',x:'For a moment. It’s easier than asking. People just say yes.'},
  {w:'kael',x:'That’s how it starts, brother. Father always said a crown makes everyone agree with you.'},
  {w:'rowan',x:'Edric said that?'},
  {w:'kael',x:'Not to you. To me. He said it was why I must always tell you no. I’m only just starting to understand him.'}
 ]},
 {id:'the_gate',after:'m20',title:'The Gate',who:['sable', 'rowan'],lines:[
  {w:'sable',x:'You want to know how he died. Your knight. Edric.'},
  {w:'rowan',x:'Only if you want to tell me.'},
  {w:'sable',x:'He held the gate alone. Twelve of us. He killed four before I reached him.'},
  {w:'sable',x:'He didn’t beg. He didn’t curse. He just kept looking past me, toward the road you took.'},
  {w:'rowan',x:'Tell Kael. Not today. But tell him.'},
  {w:'sable',x:'He’ll hate me more.'},
  {w:'rowan',x:'Probably. He deserves to hear it from someone who was there.'}
 ]},
 {id:'forgiven',after:'m20',title:'Forgiven',who:['kael', 'rowan'],lines:[
  {w:'kael',x:'You let her sit at our table. The woman who killed our father.',if:'sableoath'},
  {w:'rowan',x:'She laid down her lance for strangers. I’m not forgiving what she did. I’m making room for what she does next.',if:'sableoath'},
  {w:'kael',x:'Pretty words. Did they come with the sword?',if:'sableoath'},
  {w:'kael',x:'You sent her away. I thought you’d keep her. You keep everyone.',if:'sablegone'},
  {w:'rowan',x:'You asked me to. That was enough.',if:'sablegone'},
  {w:'kael',x:'Was it? Or did it just look good in front of the others?',if:'sablegone'},
  {w:'rowan',x:'I don’t know, Kael. I’m finding out I don’t know a lot of things.'},
  {w:'kael',x:'Good. Keep finding out. I’ll tell you when to stop.'}
 ]},
 {id:'under_orders',after:'m21',title:'Under Orders',who:['sable', 'gorm'],lines:[
  {w:'sable',x:'You were chained to a millstone, they say. Gorm.'},
  {w:'gorm',x:'Gorm was. Gorm went where the chain went.'},
  {w:'sable',x:'I went where the orders went. Twenty years. I never once wanted to stop.'},
  {w:'gorm',x:'Gorm did not pick the chain. Sable picked the orders.'},
  {w:'sable',x:'Every day. That’s worse, isn’t it?'},
  {w:'gorm',x:'Worse, or better. Gorm does not know. But Sable stopped. Gorm saw.'}
 ]},
 {id:'five_shards',after:'m21',title:'The Heavy Crown',who:['elowen', 'maelis'],lines:[
  {w:'elowen',x:'The Crown is heavy. That was all you said, Maris. You stopped there, like you stopped at Edric’s letter.'},
  {w:'maelis',x:'Some things are better known late.'},
  {w:'elowen',x:'For whom?'},
  {w:'maelis',x:'For the boy. For you. For the realm.'},
  {w:'elowen',x:'My order turns no one away. Even liars. But I’m watching you now, the way Lyra watches him.'},
  {w:'maelis',x:'Good. Someone should.'}
 ]}
);
BANTER.push(
 {after:'m11',lines:[
  {w:'nim',x:'Kuro hasn’t run off yet.'},
  {w:'gorm',x:'Nobody is holding her. That is why she stays.'},
  {w:'nim',x:'That makes no sense.'},
  {w:'gorm',x:'It made sense for Gorm.'}
 ]},
 {after:'m14',lines:[
  {w:'lyra',x:'Does he always sing while he walks?'},
  {w:'brom',x:'That’s not singing. That’s Gorm humming.'},
  {w:'gorm',x:'Gorm is not humming. Gorm is thinking loudly.'}
 ]},
 {after:'m15',lines:[
  {w:'fizzwick',x:'I’ve made a bomb that smells of roses!'},
  {w:'nim',x:'Why?'},
  {w:'fizzwick',x:'So the last thing they smell is pleasant! I’m not a monster.'}
 ]},
 {after:'m15',lines:[
  {w:'brom',x:'I’ll sing the Lament of Ironvault. All ninety verses.'},
  {w:'kael',x:'I’ll take the far watch.'},
  {w:'oakheart',x:'I have heard it. In the year it was written. It was long then too.'}
 ]},
 {after:'m17',lines:[
  {w:'jin',x:'Your Gorm carried four sailors at once.'},
  {w:'gorm',x:'Five. One was small.'},
  {w:'jin',x:'Hm. In my homeland, you would be a mountain spirit.'},
  {w:'gorm',x:'Gorm would like that. Mountains do not have to talk.'}
 ]},
 {after:'m18',lines:[
  {w:'seren',x:'Gale wants to know if your horse can fly.'},
  {w:'rowan',x:'Thistle can barely trot uphill.'},
  {w:'seren',x:'She says that’s very sad, and she’s sorry for you both.'}
 ]},
 {after:'m20',lines:[
  {w:'fizzwick',x:'The round table is lovely. I’ve added a little drawer for biscuits.'},

/* ================= BATTLE LAYOUT (v6): command rail + settings drawer ================= */
(function(){
 const side=$('#side'),acts=side.querySelector('.actions');
 const S=(d,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2.2}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
 const ic={undo:S('<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'),
  next:S('<path d="M5 5l8 7-8 7z"/><path d="M17 5v14"/>'),
  end:S('<path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9"/>',2),
  set:S('<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.9 1.9M17.5 17.5l1.9 1.9M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.9-1.9M17.5 6.5l1.9-1.9"/>')};
 const lab=(id,i,t)=>{const b=$('#'+id);b.innerHTML=ic[i]+'<span>'+t+'</span>';b.setAttribute('aria-label',t);};
 lab('aUndo','undo','Undo');lab('aNext','next','Next');lab('aEnd','end','End turn');
 const top=document.createElement('div');top.className='rturn';top.innerHTML='<span class="chip" id="rChip"></span><span id="rTurn">Turn 1</span>';side.insertBefore(top,acts);
 const sb=document.createElement('button');sb.className='b';sb.id='bSet';sb.innerHTML=ic.set+'<span>Settings</span>';sb.setAttribute('aria-label','Settings');acts.appendChild(sb);
 const sp=document.createElement('div');sp.id='setp';sp.hidden=true;
 sp.innerHTML='<div class="drawer" role="dialog" aria-label="Settings"><div class="dhead"><h2>Settings</h2><button class="icon" id="setX" aria-label="Close">×</button></div><div class="dbody" style="display:flex;flex-direction:column;gap:10px"></div></div>';
 document.body.appendChild(sp);
 const body=sp.querySelector('.dbody'),h3=document.createElement('h3');h3.textContent='Guide';
 // "How stats work" (2026-11-16, owner): plain-language rules, kept in step with hitDmg()/hitsOf()/multOf() in 40_battle.js
 const sg=document.createElement('details');sg.id='statguide';
 sg.innerHTML=`<summary>How stats work</summary>
 <h4>The stats</h4><dl>
 <dt>HP</dt><dd>Health. At 0 a unit leaves the battle. Your heroes are gravely wounded, not killed, and sit out the next battle unless healed at a chapel. If Rowan falls, the battle is lost.</dd>
 <dt>ATK</dt><dd>Strength with swords, axes, lances, bows and daggers. Weapon damage = ATK + the weapon's might.</dd>
 <dt>MAG</dt><dd>Power with tomes and spells. Spell damage = MAG + the tome's might. Healing = the staff's power + half of MAG.</dd>
 <dt>DEF</dt><dd>Armour against weapons. Each point takes 1 off every weapon hit.</dd>
 <dt>RES</dt><dd>Resistance against magic. Each point takes 1 off every spell hit.</dd>
 <dt>SPD</dt><dd>If a unit's SPD is 4 or more above its foe's, it strikes twice.</dd>
 <dt>MOV</dt><dd>How many tiles a unit can move. Forest, hills, snow and mud cost extra; cavalry is slowed most.</dd></dl>
 <h4>How a fight works</h4><ul>
 <li>Nothing is random: no misses, no lucky crits. The forecast shows the exact damage before you attack.</li>
 <li>Damage = power − the target's armour (DEF, or RES against magic) − the ground's defense bonus. Every hit does at least 1.</li>
 <li>Ground matters: tap a tile to see its bonus (forest +2, cottage +2, hill +1). Magic only counts half of it, and flyers get none.</li>
 <li>A unit strikes back once per enemy turn if the attacker is in its range.</li>
 <li>Defend gives +3 DEF until your next turn, and a defending unit strikes back at every attacker. A unit that ends its turn without moving or acting defends on its own.</li>
 <li>Zone of control: the four tiles touching a fighter. An enemy that steps into one must stop there, so it can't slip straight past; it has to go around. Flyers, scouts, thieves and hidden units ignore zones; villagers and frozen units have none. It works for both sides.</li></ul>
 <h4>Matchups</h4><ul>
 <li>Swords beat spearmen: +25% damage.</li>
 <li>Lances beat cavalry and flyers: +50%. Bows beat flyers: +50%.</li>
 <li>Cavalry hits foot soldiers, archers, mages and healers for +20%.</li>
 <li>Holy weapons and spells do double damage to the undead.</li></ul>
 <h4>Growing stronger</h4><ul>
 <li>Every 100 XP is a level. Each stat rises by its growth chance; the Army screen shows each unit's growth.</li>
 <li>On stat cards, green numbers are bonuses from gear and red numbers are penalties.</li>
 <li>From level 10, units can promote at a training yard for a stronger class and extra stats.</li></ul>`;
 body.append($('#hud'),h3,$('#card'),sg,$('#logbox'));$('#logbox').open=true;
 const close=()=>{sp.hidden=true;};
 sb.onclick=()=>{unlockAudio();sfx('tick');sp.hidden=false;ui();};
 $('#setX').onclick=close;sp.addEventListener('click',e=>{if(e.target===sp)close();});
 $('#bMenu').addEventListener('click',close);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sp.hidden){close();e.stopImmediatePropagation();}},true);
 const _ui=ui;ui=function(){_ui.apply(this,arguments);if(!G)return;$('#rChip').className='chip '+(G.side==='R'?'R':'B');const w=G.m.win;$('#rTurn').textContent='Turn '+G.turn+(w&&w.type==='survive'?' / '+w.turns:'');};
})();

/* ================= v9: item picker + tile card ================= */
function pickItem(title,cur,opts,cb){const el=document.createElement('div');el.id='pick';el.setAttribute('role','dialog');
 el.innerHTML=`<div class="pc"><div class="eyebrow">${esc(title)}</div><h3>Equipped: ${cur?esc(IT[cur].n):'<span class="muted">nothing</span>'}</h3>${cur?`<p class="muted" style="margin:0;font-size:12.5px">${esc(itemDesc(cur))}</p>`:''}
  <div class="pl">${opts.length?opts.map((o,i)=>`<button class="po" data-i="${i}"><b>${esc(o.n)}</b><span>${esc(o.d||'')}</span>${o.h?`<span class="gcs">${o.h}</span>`:''}<i>${o.q>1?'×'+o.q:''}</i></button>`).join(''):'<p class="muted">Nothing in the convoy fits this slot. Shops sell more.</p>'}</div>
  <div class="row"><button class="b gold" data-keep="1">${cur?'Keep current':'Close'}</button></div></div>`;
 const close=v=>{el.remove();cb(v);};
 el.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){close(opts[+b.dataset.i].v);return;}if(e.target.closest('[data-keep]')||e.target===el){sfx('tick');close(null);}});
 document.body.appendChild(el);}
function terChips(ch,u){const T=TER[ch],o=[];
 if(T.block){o.push(['Impassable','dn']);if(T.low||ch==='#')o.push(['Shots pass over','']);return o;}
 if(T.d)o.push([`DEF ${T.d>0?'+':'−'}${Math.abs(T.d)}`,T.d>0?'up':'dn']);
 o.push([`Move cost ${T.c}`,T.c>1?'dn':'']);if(T.cav)o.push([`Mounted ${T.cav}`,'dn']);if(T.heavy)o.push([`Heavy ${T.heavy}`,'dn']);
 if(T.heal)o.push([`Heals ${T.heal} HP a turn`,'up']);if(ch==='H')o.push(['Bows +1 range','up']);
 if(u&&isFlyer(u)&&T.d)o.push(['Flyers get no cover','']);
 return o;}
function tileCard(){const tt=$('#ttip');if(!tt)return;const live=G&&G.started&&!G.over,S=live&&ctx().sel;
 // a selected unit always shows its own card; otherwise whatever tile or unit was tapped
 const I=live&&(S?{unit:S.id}:G.inspect);
 if(!I){tt.hidden=true;return;}
 let u=null,r=I.r,c=I.c;if(I.unit){u=byId(I.unit);if(!u||u.dead||!seenByPlayer(u)){tt.hidden=true;return;}r=u.r;c=u.c;}
 const ch=tile(r,c),T=TER[ch],chips=terChips(ch,u).map(([t,k])=>`<span class="${k}">${esc(t)}</span>`).join('');
 let h='';
 if(u){// compact unit card (owner 2026-11-17: "too big, just basic stats"): name, level, HP bar, four numbers
  const sideC=u.side==='R'?'#ff8a7a':u.side==='G'?'#9fe39a':'#9cc4ff',fr=Math.max(0,u.hp)/u.s.hp,w=W(u),mk=w&&w.wt!=='staff'?(isMagicAtk(u)?'mag':'atk'):'atk';
  const pw=stat(u,mk)+(w&&w.wt!=='staff'?(w.mt||0):0);
  h=`<div class="tn"><span style="color:${sideC}">●</span> ${esc(u.name)} <small>Lv ${u.lv||''}</small>${u.defend?' <small class="gu">DEF+3</small>':''}</div>
   <div class="hpb"><i style="width:${(fr*100).toFixed(0)}%;background:${fr>.6?'#6fd06a':fr>.3?'#e8c24a':'#e8573f'}"></i><b>${u.hp}/${u.s.hp}</b></div>
   <div class="ks"><span>${mk==='mag'?'MAG':'ATK'} <b>${pw}</b></span><span>DEF <b>${stat(u,'def')}</b></span><span>SPD <b>${stat(u,'spd')}</b></span><span>MOV <b>${movOf(u)}</b></span></div>
   <div class="tc ter"><span>${esc(T.n)}</span>${terChips(ch,u).filter(([t])=>!/^(Move cost|Mounted|Heavy)/.test(t)).map(([t,k])=>`<span class="${k}">${esc(t)}</span>`).join('')}</div>`;}
 else{const chest=G.chests.find(x=>x.r===r&&x.c===c&&(x.kind!=='hidden'||x.found));
  h=`<div class="tn">${esc(T.n)}</div><div class="tc">${chips}</div><div class="tt">${esc(T.tip)}${chest?' '+(chest.open?'An empty chest.':chest.kind==='iron'?'An iron chest: needs a scout or an Iron Key.':'A chest: end a unit’s turn here to open it.'):''}</div>`;}
 tt.innerHTML=h;tt.hidden=false;tt.classList.toggle('unit',!!u);
 // put the card in whichever corner hides the least: the unit it describes, then enemies, then allies and
 // the selected unit's move tiles (top-left wins ties; zoom buttons sit bottom-right)
 const z=cam.z,Ts=TS*z,w=tt.offsetWidth,hh=tt.offsetHeight,v=$('#view'),VW=v.clientWidth,VH=v.clientHeight,m=8;
 const box=[];for(const x of G.units){if(x.dead||x.gone||!seenByPlayer(x))continue;box.push([x.r,x.c,x===u||(!u&&x.r===r&&x.c===c)?40:x.side==='R'?6:3]);}
 if(!u)box.push([r,c,40]);
 const C=ctx();if(C.sel&&C.reach&&C.reach.ends)for(const k of C.reach.ends){const [rr,cc]=k.split(',').map(Number);box.push([rr,cc,1]);}
 const score=([x,y])=>{let sc=0;for(const [rr,cc,wt] of box){const bx=(cc*TS-cam.x)*z,by=(rr*TS-cam.y)*z;const ox=Math.max(0,Math.min(x+w,bx+Ts)-Math.max(x,bx)),oy=Math.max(0,Math.min(y+hh,by+Ts)-Math.max(y,by));sc+=ox*oy*wt;}return sc;};
 const spots=[[m,m],[VW-w-m,m],[m,VH-hh-m]];let p=spots[0],bs=score(p)+.5;for(const q of spots.slice(1)){const sc=score(q);if(sc<bs){bs=sc;p=q;}}
 tt.style.left=p[0]+'px';tt.style.top=p[1]+'px';tt.style.pointerEvents=S?'none':'';tt.style.opacity=S?'.9':'';}
(function(){const v=$('#view');if(!v)return;const tt=document.createElement('div');tt.id='ttip';tt.hidden=true;tt.title='Tap to close';v.appendChild(tt);
 tt.addEventListener('pointerdown',e=>e.stopPropagation());tt.addEventListener('click',e=>{e.stopPropagation();if(G)G.inspect=null;ui();});
 const _u=ui;ui=function(){_u.apply(this,arguments);try{tileCard();}catch(e){}};})();

// battle card stats: base value, then in green/red what gear and effects add (weapon might on ATK, or MAG for magic)
function cardStats(u){const w=W(u),mk=w&&w.wt!=='staff'?(isMagicAtk(u)?'mag':'atk'):null;
 const one=(k,lab)=>{const base=u.s[k]||0,add=stat(u,k)-base+(k===mk?(w.mt||0):0);return `<span>${lab} ${base}${add?`<b class="${add>0?'gu':'gd'}"> (${add>0?'+':'−'}${Math.abs(add)})</b>`:''}</span>`;};
 const mv=CLS[u.cls].mv,ma=movOf(u)-mv;
 return one('atk','ATK')+one('def','DEF')+one('mag','MAG')+one('res','RES')+one('spd','SPD')+`<span>Move ${mv}${ma?`<b class="${ma>0?'gu':'gd'}"> (${ma>0?'+':'−'}${Math.abs(ma)})</b>`:''}</span>`;}

window.addEventListener('resize',()=>{if(G)resize();SCENE.wbase&&(SCENE.wk=-1);});
try{resize();}catch(e){}
if(typeof soundBtn==='function')soundBtn();
showTitle();
requestAnimationFrame(frame);
